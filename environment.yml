name: thgfm
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # Mirrors requirements.txt (PyTorch cu121 + PyG/DGL find-links).
      - --index-url https://download.pytorch.org/whl/cu121
      - --extra-index-url https://pypi.org/simple
      - -f https://data.pyg.org/whl/torch-2.4.0+cu121.html
      - -f https://data.dgl.ai/wheels/torch-2.4/cu121/repo.html
      - dill==0.4.1
      - numpy==2.4.3
      - pandas==3.0.1
      - torch==2.4.0
      - torchvision==0.19.0
      - dgl==2.4.0+cu121
      - torch-scatter==2.1.2+pt24cu121
      - torch-cluster==1.6.3+pt24cu121
      - torch-sparse==0.6.18+pt24cu121
      - torch-spline-conv==1.2.2+pt24cu121
      - torch-geometric==2.7.0
      - ogb>=1.3.6
      - packaging>=23.0
      - setuptools<81
      - tqdm==4.67.3
      - seaborn==0.13.2
      - matplotlib==3.10.8
      - transformers==4.46.3
      - sentencepiece==0.2.1
      - wandb
